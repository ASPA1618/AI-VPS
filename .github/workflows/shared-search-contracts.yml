name: Shared Search Contracts

on:
  pull_request:
    paths:
      - "shared_search/**"
      - "infra/search/**"
      - "benchmarks/shared_search_cases_v1.json"
      - "scripts/run_search_benchmark.py"
      - "tests/test_shared_search.py"
      - ".github/workflows/shared-search-contracts.yml"
  push:
    branches: [main]
    paths:
      - "shared_search/**"
      - "infra/search/**"
      - "benchmarks/shared_search_cases_v1.json"
      - "scripts/run_search_benchmark.py"
      - "tests/test_shared_search.py"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q shared_search scripts/run_search_benchmark.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_shared_search*.py' -v
      - name: Benchmark corpus contract
        run: python scripts/run_search_benchmark.py --validate-only
      - name: Compose contract
        run: docker compose -f infra/search/compose.yml config >/dev/null
