use_default_settings: true

general:
  debug: false
  instance_name: "Shared Search Gateway"

search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json

server:
  limiter: false
  image_proxy: false
  secret_key: "internal-shared-search-not-an-auth-token"

engines:
  - name: brave
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
  - name: mojeek
    disabled: false
